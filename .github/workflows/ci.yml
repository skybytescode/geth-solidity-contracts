name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^bindings/[a-z0-9]*\.go$'))"
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Test (simulated chain, race detector)
        run: go test -race -count=1 ./...

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Recompile contracts and regenerate bindings
        run: make bindings
      - name: Committed bindings match the contracts
        run: git diff --exit-code -- bindings/
